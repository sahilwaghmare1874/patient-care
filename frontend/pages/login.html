<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal Login | Health Insurance Assurance</title>
    <meta name="description" content="Secure authentication portal for Patients, Doctors, Pathology Labs, Pharmacies, and Government Officers.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-light">

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg healthcare-navbar">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="../index.html">
                Health Insurance<span> Assurance</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="register.html" class="btn btn-outline-primary btn-sm">New Patient Registration</a>
                <a href="../index.html" class="btn btn-outline-secondary btn-sm">← Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container" style="max-width: 500px;">
            <div class="text-center mb-4">
                <div class="display-6 text-primary mb-2"><i class="bi bi-shield-lock-fill"></i></div>
                <h3 class="fw-bold">Sign In to Healthcare Portal</h3>
                <p class="text-muted small">Access your connected medical journey, provider dashboard, or administration portal.</p>
            </div>

            <div class="card form-card">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username, Mobile or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="loginUsername" required placeholder="Enter username, mobile, or email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="loginPassword" required placeholder="Enter password">
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login to Portal
                        </button>
                    </div>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <p class="text-muted small mb-1">Don't have a permanent Patient ID yet?</p>
                    <a href="register.html" class="fw-bold text-primary small">Register New Patient ID →</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core API & Auth Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
